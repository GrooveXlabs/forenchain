services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: forenchain
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: forenchain
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forenchain"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://forenchain:${DB_PASSWORD:-changeme}@db:5432/forenchain
      SECRET_KEY: ${SECRET_KEY}
      HMAC_SECRET: ${HMAC_SECRET}
      ENVIRONMENT: production
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
